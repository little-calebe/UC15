<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authora</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <button class="menu-btn" aria-label="Abrir menu" type="button">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <a class="brand" href="#" aria-label="Authora">
          <img src="img/Authora.logopretolaranja.jpg" alt="AUTHORA" />
        </a>

        <nav class="nav-actions" aria-label="Navegação principal">
          <button class="nav-link" type="button">Cadastrar</button>
          <a href="#" class="nav-link login-link">
            <span class="login-icon">↪</span>
            Login
          </a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <h1>Cadastro de novo usuário</h1>

      <form class="register-form">
        <div class="form-grid">
          <section class="form-column">
            <h2>Dados Pessoais:</h2>

            <div class="field">
              <label for="nome">Nome<span class="required">*</span></label>
              <input id="nome" name="nome" type="text" required />
            </div>

            <div class="field">
              <label for="documento">Documento<span class="document-type">CPF/CNPJ)</span><span class="required">*</span></label>
              <input id="documento" name="documento" type="text" required />
            </div>

            <div class="field">
              <label for="email">E-mail<span class="required">*</span></label>
              <input id="email" name="email" type="email" required />
            </div>

            <div class="field">
              <label for="empresa">Empresa</label>
              <input id="empresa" name="empresa" type="text" />
            </div>

            <div class="field">
              <label for="telefone">Telefone</label>
              <input id="telefone" name="telefone" type="tel" />
            </div>

            <label class="checkbox-row" for="cliente-ldsoft">
              <input id="cliente-ldsoft" name="cliente-ldsoft" type="checkbox" />
              <span>Já sou cliente da LDSOFT</span>
            </label>
          </section>

          <section class="form-column">
            <h2>Dados de Acesso:</h2>

            <div class="field">
              <label for="login">Login<span class="required">*</span></label>
              <input id="login" name="login" type="text" required />
            </div>

            <div class="field">
              <label for="senha">Senha<span class="required">*</span></label>
              <input id="senha" name="senha" type="password" required />
            </div>

            <div class="field">
              <label for="confirmar-senha">Confirmar Senha<span class="required">*</span></label>
              <input id="confirmar-senha" name="confirmar-senha" type="password" required />
            </div>

            <div class="field">
              <label for="tipo-pessoa">Tipo de Pessoa<span class="required">*</span></label>
              <select id="tipo-pessoa" name="tipo-pessoa" required>
                <option value="">Selecione</option>
                <option value="pf">Pessoa Física</option>
                <option value="pj-escritorio">Pessoa Jurídica - Escritório de Adv/PI</option>
                <option value="pj-empresa">Pessoa Jurídica - Empresa</option>
              </select>
            </div>

            <div class="field">
              <label for="area-interesse">Área de Interesse<span class="required">*</span></label>
              <select id="area-interesse" name="area-interesse" required>
                <option value="">Selecione</option>
                <option value="cancoes">Canções</option>
                <option value="propaganda">Expressão de Propaganda</option>
                <option value="livros">Livros e eBooks</option>
                <option value="fotos">Fotos e Ilustrações</option>
                <option value="patentes">Projetos de Patentes</option>
                <option value="egames">eGames</option>
                <option value="engenharia">Projetos de Arquitetura e Engenharia</option>
                <option value="moda">Direito da Moda</option>
                <option value="outros">Outros</option>
              </select>
            </div>

            <label class="terms-row" for="aceito-termos">
              <input id="aceito-termos" name="aceito-termos" type="checkbox" required />
              <span>Eu aceito os <a href="#">termos de uso</a> do sistema</span>
            </label>
          </section>
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit" disabled>Salvar</button>
          <button class="btn btn-secondary" type="button">Cancelar</button>
        </div>
      </form>
    </main>

    <footer class="site-footer">
      <a href="http://www.ldsoft.com.br" aria-label="LDSOFT">
        <img src="img/Authora.loginlogoldsoft.png" alt="LDSOFT" />
      </a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
