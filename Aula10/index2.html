<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script</title>
</head>
<body>
    <h1>Valores das variáveis</h1>
    <p id="teste1">O valor é (a): </p>
    <p id="teste2">O valor é (b): </p>
    <p id="teste3">O valor é (c): </p>
    <p id="teste4">O valor é (d): </p>
    <p id="teste5">O valor é (e): </p>
    <p id="teste6">O valor é (f): </p>
    <p id="teste7">O valor é (g): </p>

    <script type="text/javascript">
        var a; 
        var b = 1; 
        var c = [55, 21, 34, 49, 50];
        var d = ["Verde", "Amarelo", "Azul", "Branco"];
        var e = "Senac";
        var f = false;
        var g = null;

        document.getElementById("teste1").textContent += a;
        document.getElementById("teste2").textContent += b;
        document.getElementById("teste3").textContent += c[2];
        document.getElementById("teste4").textContent += d[2];
        document.getElementById("teste5").textContent += e;
        document.getElementById("teste6").textContent += f;
        document.getElementById("teste7").textContent += g;

    </script>

</body>
