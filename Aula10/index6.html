<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores lógicos</title>
</head>
<body>
    <h1>Operadores Lógicos</h1>
    <h3>Lógico && (e)</h3>
    <script>
        var resposta = true && true;
        document.write(resposta + '<br>');

        resposta = false && false;
        document.write(resposta + '<br>');

        resposta = false && true;
        document.write(resposta + '<br>');

        resposta = false && (3 == 4);
        document.write(resposta + '<br>');

        resposta = 'Senac' && 'Javascript';
        document.write(resposta + '<br>');

        resposta = false && '';
        document.write(resposta + '<br>');

    </script>

    <h3>Lógico || (ou)</h3>
    <script>
        resposta = true || true;
        document.write(resposta + '<br>');

        resposta = false || true;
        document.write(resposta + '<br>');

        resposta = false || (3 == 4);
        document.write(resposta + '<br>');

        resposta = 'Senac' || 'Javascript';
        document.write(resposta + '<br>');
    </script>
</body>
</html>
